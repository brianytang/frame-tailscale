[Unit]
RequiresMountsFor=/home/steamos/tailscale

[Service]
# Steam Frame supports nftables; legacy iptables fails to initialize.
Environment=TS_DEBUG_FIREWALL_MODE=nftables
ExecStartPre=
ExecStartPre=/home/steamos/tailscale/tailscaled --cleanup
ExecStart=
ExecStart=/home/steamos/tailscale/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
ExecStopPost=
ExecStopPost=/home/steamos/tailscale/tailscaled --cleanup
