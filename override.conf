[Unit]
RequiresMountsFor=/home/.tailscale-bin

[Service]
# Steam Frame supports nftables; legacy iptables fails to initialize.
Environment=TS_DEBUG_FIREWALL_MODE=nftables
ExecStartPre=
ExecStartPre=/home/.tailscale-bin/tailscaled --cleanup
ExecStart=
ExecStart=/home/.tailscale-bin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
ExecStopPost=
ExecStopPost=/home/.tailscale-bin/tailscaled --cleanup
